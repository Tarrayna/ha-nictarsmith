
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml

input_number:
  car_tank_capacity_gal:
    name: Car Tank Capacity
    icon: mdi:gas-station
    min: 1
    max: 30
    step: 0.1
    initial: 11.9
    unit_of_measurement: gal
  car_avg_mpg:
    name: Car Average MPG
    icon: mdi:speedometer
    min: 10
    max: 100
    step: 0.5
    initial: 54.5
    unit_of_measurement: mpg
  car_last_service_odometer:
    name: Odometer at Last Service
    icon: mdi:counter
    min: 0
    max: 300000
    step: 1
    initial: 39044
    unit_of_measurement: mi
  car_service_interval_miles:
    name: Service Interval
    icon: mdi:wrench
    min: 1000
    max: 20000
    step: 500
    initial: 10000
    unit_of_measurement: mi

input_datetime:
  car_last_service_date:
    name: Car Last Service Date
    has_date: true
    has_time: false
    icon: mdi:wrench-clock
    initial: "2026-04-01"

template:
  - sensor:
      - name: "Car Coolant Temp"
        unique_id: car_coolant_temp_f
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        state: >
          {% set c = states('sensor.garage_wican_14c19fd95799_local_05_enginecoolanttemp') %}
          {{ (c | float * 9/5 + 32) | round(1) if c not in ['unknown','unavailable'] else none }}
      - name: "Car Catalyst Pre Temp"
        unique_id: car_cat_pre_temp_f
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        state: >
          {% set c = states('sensor.garage_wican_14c19fd95799_local_3c_cattempbank1sens1') %}
          {{ (c | float * 9/5 + 32) | round(1) if c not in ['unknown','unavailable'] else none }}
      - name: "Car Catalyst Post Temp"
        unique_id: car_cat_post_temp_f
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        state: >
          {% set c = states('sensor.garage_wican_14c19fd95799_local_3e_cattempbank1sens2') %}
          {{ (c | float * 9/5 + 32) | round(1) if c not in ['unknown','unavailable'] else none }}

lovelace:
  dashboards:
    tarrayna-car:
      mode: yaml
      title: Tarrayna's Car
      icon: mdi:car
      show_in_sidebar: true
      filename: dashboards/tarrayna_car.yaml
prometheus:
  filter:
    include_entity_globs:
      - sensor.office_tarrayna_switch_*
      - sensor.office_nick_smart_wi_fi_power_strip_*

# Calls Todoist's own REST API directly (2026-09-24), bypassing HA's
# Todoist integration - its todo.* entities don't sync due dates for
# recurring tasks (confirmed via todo.get_items returning no "due" field
# for any of the 20 recurring Chores items) and the legacy YAML sensor
# platform that used to expose this no longer exists in this HA version
# (homeassistant.components.todoist.sensor was removed). Used by
# script.chores_due_reminder (scripts.yaml) to read due/overdue tasks,
# and by automations/chores.yaml's chores_mark_done_from_notification to
# close a task from its notification - closing via Todoist's own API
# also avoids a known HA core bug where todo.update_item can delete an
# entire recurring task series instead of completing just today's
# occurrence (home-assistant/core#107504).
rest_command:
  todoist_get_active_tasks:
    url: >-
      https://api.todoist.com/api/v1/tasks{% if cursor is defined and cursor %}?cursor={{ cursor }}{% endif %}
    method: GET
    headers:
      Authorization: !secret todoist_api_token
  todoist_close_task:
    url: "https://api.todoist.com/api/v1/tasks/{{ task_id }}/close"
    method: POST
    headers:
      Authorization: !secret todoist_api_token
  todoist_get_collaborators:
    url: "https://api.todoist.com/api/v1/projects/{{ project_id }}/collaborators"
    method: GET
    headers:
      Authorization: !secret todoist_api_token
