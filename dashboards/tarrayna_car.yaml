views:
  - type: sections
    header:
      card:
        type: markdown
        content: |
          # Hello {{ user }}
          Here is the status of Tarrayna's Car
    sections:
      - type: grid
        cards:
          - type: heading
            heading: At a Glance
          - type: gauge
            entity: sensor.garage_wican_14c19fd95799_local_soc
            name: Battery
            needle: true
            severity:
              green: 40
              yellow: 10
              red: 0
          - type: gauge
            entity: sensor.garage_wican_14c19fd95799_local_2f_fueltanklevel
            name: Gas
            needle: true
            severity:
              green: 25
              yellow: 10
              red: 0
          - type: tile
            entity: sensor.garage_wican_14c19fd95799_local_odometer
            name: Odometer
            icon: mdi:counter
      - type: grid
        cards:
          - type: heading
            heading: Estimated Fuel Range
          - type: markdown
            content: >
              ## {{ ((states('sensor.garage_wican_14c19fd95799_local_2f_fueltanklevel')|float(0) / 100)
              * states('input_number.car_tank_capacity_gal')|float(0)
              * states('input_number.car_avg_mpg')|float(0)) | round(0) }} mi remaining
      - type: grid
        cards:
          - type: heading
            heading: Battery Health
          - type: entities
            entities:
              - entity: sensor.garage_wican_14c19fd95799_local_5b_hybrbatpackremlife
                name: Battery Health (Remaining Life)
      - type: grid
        cards:
          - type: heading
            heading: Vehicle Health
          - type: markdown
            content: >
              {% set raw = states('sensor.garage_wican_14c19fd95799_local_01_monitorstatus')|int(0) %}
              {% set mil_on = (raw // 128) == 1 %}
              {% set dtc_count = raw % 128 %}
              {% if not mil_on and dtc_count == 0 %}
              ## 🟢 No Known Issues
              {% else %}
              ## 🔴 Check Engine — {{ dtc_count }} code{{ 's' if dtc_count != 1 else '' }}
              {% endif %}
          - type: entities
            entities:
              - entity: sensor.garage_wican_14c19fd95799_local_05_enginecoolanttemp
                name: Engine Coolant Temp
              - entity: sensor.wican_14c19fd95799_local_batt_voltage
                name: 12V Battery Voltage
